<style>
    /* Better hover and active states */
    .navbar-nav .nav-link {
        transition: all 0.2s ease;
        position: relative;
    }

    /* Inactive links are slightly transparent */
    .navbar-nav .nav-link.text-white-100 {
        color: rgba(255, 255, 255, 0.75) !important;
    }

    /* Hover effect - becomes fully white */
    .navbar-nav .nav-link.text-light:hover {
        color: rgb(225, 224, 224) !important;
        transform: translateY(-1px);
    }

    /* Active link - fully white with underline */
    .navbar-nav .nav-link.active {
        color: white !important;
        font-weight: 600;
    }

    .navbar-nav .nav-link.active::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
        background-color: white;
        border-radius: 1px;
    }

    /* Hover effect for active link */
    .navbar-nav .nav-link.active:hover {
        transform: translateY(-1px);
    }

    /* Dropdown item hover */
    .dropdown-item:hover {
        background-color: #f8f9fa;
    }
</style>

<script>
    // Add active state on click
    document.addEventListener('DOMContentLoaded', function () {
        const navLinks = document.querySelectorAll('.navbar-nav .nav-link:not(.dropdown-toggle)');

        navLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                // Remove active class from all links
                navLinks.forEach(item => {
                    item.classList.remove('active');
                    item.classList.add('text-white-75');
                    item.classList.remove('text-white');
                });

                // Add active class to clicked link
                this.classList.add('active');
                this.classList.remove('text-white-75');
                this.classList.add('text-white');
            });
        });
    });
</script>
